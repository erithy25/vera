[package]
name = "preflight-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "OCR-error-tolerant secret detection for screen recordings"
license = "UNLICENSED"

[lib]
name = "preflight_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
