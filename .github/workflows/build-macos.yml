name: Build Vera (macOS)

# Builds the full app (frontend + Rust + Swift/ObjC sidecars) on a real Apple
# Silicon Mac runner, UNSIGNED, so we can confirm the native stack compiles and
# get a downloadable DMG artifact without needing a local Mac. Signing /
# notarization is intentionally skipped here (that stays a local release step).

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/cool-albattani-ojjoby

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Toolchain versions
        run: |
          node --version
          rustc --version || true
          swiftc --version || true
          xcodebuild -version || true

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app (unsigned)
        run: npm run tauri build

      - name: Upload DMG artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vera-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
