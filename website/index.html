<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vera — find the API keys in your screen recordings</title>
    <meta
      name="description"
      content="Vera reads your finished screen recording and tells you which API keys, tokens and passwords are visible in it, with the timestamp of each one. Local, on your Mac, before you publish."
    />
    <meta name="theme-color" content="#fefffc" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Fraunces stands in for the display serif and Inter for the sans — the two
      substitutes named in the design spec, since the originals are licensed
      fonts. Both are self-hosted (see index.css), so the page makes no
      third-party request at all.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-var-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-var-latin.woff2" crossorigin />
    <link rel="preload" as="image" href="/img/hero-night.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
