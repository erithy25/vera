[workspace]
members = ["core"]

[package]
name = "vera"
version = "0.1.0"
description = "Vera — finds credentials left visible in your screen recordings"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# cc is gone with the Objective-C natives; the two remaining sidecars are
# Swift and are compiled by invoking swiftc directly. See build.rs.
[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Core logic without Tauri — builds and tests on any platform.
# See src-tauri/core/src/lib.rs for why this split exists.
vera-core = { path = "core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# base64 for handing a still frame to the webview as a data URL
base64 = "0.22"
