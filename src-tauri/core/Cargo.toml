[package]
name = "vera-core"
version = "0.5.2"
edition = "2021"
rust-version = "1.77.2"
description = "Vera-Kernlogik ohne Tauri-Abhängigkeit — dadurch auf jeder Plattform testbar"
license = ""

[lib]
name = "vera_core"
path = "src/lib.rs"

[dependencies]
regex = "1"
aes-gcm = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
